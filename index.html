<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="assets/favicon.png" type="image/png">
    <title>Rock Paper Scissor</title>
</head>
<body>
    <header>Rock Paper Scissors</header>

    <main>
        <section class="score">
            <span class="yourScore">Your Score : 0</span>
            <span class="botScore">Bot's Score : 0</span>
            <span class="drawScore">Draw : 0</span>
        </section>

        <section class="game">
            <span class="playerEl">You : -</span>
            <span class="botEl">Bot : -</span>
        </section>

        <section class="gameButton">
            <button class="rock">✊</button>
            <button class="paper">🤚</button>
            <button class="scissor">✌️</button>
        </section>

        <section class="totalPlays">
            <span class="total">Total plays: 0</span>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
